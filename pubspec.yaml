name: fluttnotes
description: "Flutter notes use data local"
publish_to: "none" # Remove this line if you wish to publish to pub.dev
# flutter build appbundle --release --no-tree-shake-icons
# flutter build web --release --no-tree-shake-icons
# firebase deploy --only hosting:lamun-mail
# flutter pub upgrade --major-versions

version: 1.0.0+4

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  cupertino_icons: ^1.0.9
  datalocal: ^2.0.0
  flutter:
    sdk: flutter
  font_awesome_flutter: ^11.0.0
  google_fonts: ^8.2.0
  intl: ^0.20.3
  provider: ^6.1.5+1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
